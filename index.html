<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>全息闪卡 · WebGL 旗舰版</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #e8e8f0;
  background: radial-gradient(ellipse at 50% 0%, #2a2440 0%, #121019 60%, #0a0910 100%) fixed;
}
#gl {
  position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: none;                   /* 在画布上拖动 = 旋转卡片，不滚动页面 */
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  outline: none;
}
#gl.dragging { cursor: grabbing !important; }
header {
  position: fixed; top: 0; left: 0; right: 0; padding: max(18px, env(safe-area-inset-top)) 16px 0;
  text-align: center; pointer-events: none; z-index: 1;   /* 画布在 DOM 里更靠后，标题要显式压在它上面 */
}
h1 { font-size: 20px; font-weight: 600; letter-spacing: .05em; margin: 0 0 4px; }
p.tip { margin: 0; opacity: .6; font-size: 13px; }
a.back {
  position: fixed; left: 14px; top: max(14px, env(safe-area-inset-top)); z-index: 2;
  color: #cfc8ff; font-size: 13px; text-decoration: none; opacity: .75; padding: 6px 8px; border-radius: 8px;
}
a.back:hover, a.back:focus-visible { opacity: 1; background: rgba(255,255,255,.06); }
nav {
  position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom));
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 12px;
}
nav button {
  font: inherit; font-size: 13px; color: #e8e8f0; cursor: pointer;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
  border-radius: 999px; padding: 7px 14px; transition: background .2s, border-color .2s;
}
nav button:hover { background: rgba(255,255,255,.13); }
nav button[aria-pressed="true"] { background: rgba(180,160,255,.25); border-color: rgba(200,185,255,.55); }
nav .sep { width: 1px; background: rgba(255,255,255,.15); margin: 4px 4px; }
#msg {
  position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center;
}
#msg.show { display: grid; }
#msg div { max-width: 360px; background: rgba(20,18,32,.92); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 22px 22px 18px; line-height: 1.7; font-size: 14px; }
#msg a { color: #c9b8ff; }
.loading #gl { opacity: 0; }
#gl { transition: opacity .4s ease; }
@media (prefers-reduced-motion: reduce) { #gl { transition: none; } }
</style>
<!-- Three.js：vendor 到仓库里的摇树精简版（r186，MIT），全部相对路径，GitHub Pages 子路径 /webgl/ 下可用，不依赖 CDN -->
<script type="importmap">
{ "imports": { "three": "./vendor/three-holo.min.js" } }
</script>
</head>
<body class="loading">
  <a class="back" href="../">← CSS 版</a>
  <header>
    <h1>全息闪卡 · WebGL 旗舰版</h1>
    <p class="tip">悬停倾斜 · 按住拖动旋转看背面 · 双击翻面</p>
  </header>
  <canvas id="gl" aria-label="可交互的 3D 全息闪卡"></canvas>
  <nav aria-label="选择卡面">
    <button type="button" data-card="frost" aria-pressed="true">霜晶龙 · 彩虹镭射</button>
    <button type="button" data-card="star" aria-pressed="false">星尘狐 · 亮片箔</button>
    <button type="button" data-card="sun" aria-pressed="false">金曜狮王 · 反闪金箔</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="flip">翻面</button>
  </nav>
  <div id="msg" role="alert"><div></div></div>
  <noscript><p style="text-align:center;margin-top:40vh">需要开启 JavaScript。<a href="../" style="color:#c9b8ff">返回 CSS 版</a></p></noscript>

<script type="module">
const msg = document.getElementById('msg');
const fail = (html) => { msg.firstElementChild.innerHTML = html; msg.classList.add('show'); document.body.classList.remove('loading'); };
const backLink = '<a href="../">返回 CSS 版（不需要 WebGL）</a>';

// 1) WebGL2 检测：不支持时直接提示，不下载 Three.js
const probe = document.createElement('canvas').getContext('webgl2');
if (!probe) {
  fail(`你的浏览器或设备不支持 <b>WebGL2</b>（也可能被禁用了硬件加速），无法显示 3D 旗舰版。<br>${backLink}`);
} else {
  probe.getExtension('WEBGL_lose_context')?.loseContext();
  try {
    const { start, CONFIG } = await import('./js/holo.js');
    const cards = [...document.querySelectorAll('nav [data-card]')];
    const fromHash = location.hash.slice(1);
    const initial = cards.some(b => b.dataset.card === fromHash) ? fromHash : 'frost';
    const api = start({
      canvas: document.getElementById('gl'),
      initialCard: initial,
      onReady: (r) => { if (r?.lost) fail(`WebGL 上下文丢失（可能是显卡资源不足）。请刷新页面重试，或${backLink}`); },
    });
    const select = (key) => {
      api.setCard(key);
      cards.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.card === key)));
      history.replaceState(null, '', '#' + key);
    };
    cards.forEach(b => b.addEventListener('click', () => select(b.dataset.card)));
    select(initial);
    document.getElementById('flip').addEventListener('click', () => api.flipOver());
    window.__holo = api;          // 调试 / 自动化截图用
    requestAnimationFrame(() => document.body.classList.remove('loading'));
  } catch (err) {
    console.error(err);
    fail(`3D 版加载失败：${String(err.message || err).replace(/</g, '&lt;')}<br>${backLink}`);
  }
}
</script>
</body>
</html>
